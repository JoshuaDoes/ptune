# Only affects nohw builds.
# Removes delay in starting an app for gem5 when testing driver issues (and not caring about pdump)
PDumpAppConnectWaitMS=0

#b/446663124
# Allow Android Hardware Buffer to be mapped to host visible memory
AllowAhbHostVisibleMemory=1

#b/421977299
#b/402700686
# Disable packed RGB8 as it breaks breaks rendering into RGBX AHBs causing page faults and Greyscale rendering
EnablePackedRGB8=0

#b/423292052
# Workaround for an application issue causing FBM-related page faults
DisableFBCDC=1
PDSFragBufferSize=4096

#b/378632977
# Workaround an application issue regarding F16 arithmetic overflow resulting in on screen corruption
# corruption
#b/405110036
# Workaround an application issue regarding F16 arithmetic overflow resulting in an overly
# bright light source
#b/408058979
# Workaround an application issue where highp data is being used in mediump calculations
# resulting in on screen corruption
USC2F16OverflowToMax=1

#b/423623611
# Enable CL GL interop for specific applications
EnableClGLInterop=1

#b/452756300
# Workaroud OOB accesses from ChessSudoku, KillerSudoku, ClassicSudoku,
# MiracleSudokuCTC, SandwichSudoku, ArrowSudoku
#b/425369461
# Enable robust buffer access to workaround shader out of bounds accesses
#b/442860714
# Workaround an unknown issue that is under active debug
#b/436241035
# Workaround an unknown issue that is under debug
RobustBufferAccess=1

#b/425705114
# Disable tile packing to workaround a driver issue with tile packing that
# causes rare on screen corruption.
DisableFBCDCTilePacking=1

#b/430024012
# Ensure f16 fast path is enabled
EnableHWAcceleratedF16Fma=1

#b/430680303
# Workaround for an an application issue where a fragment shader's mediump
# calculation underflows resulting in on screen noise.
#b/434236477
# Workaround for a game issue where in a fragment shader, operations on mediump
# variables can get subnormal, causing water patches to not render.
#b/456798808
# Workaround an unknown issue that is under debug, where operations on mediump
# variables cause water to not render correctly in a fragment shader.
ForceFragmentShaderHighp=all

#b/449719702
# Workaround game passing float16 data to uint32 vertex attribute
FixAppBugs1=2
